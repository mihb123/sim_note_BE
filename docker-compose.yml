services:
  app:
    build: .
    container_name: simnote_app
    volumes:
      - .:/var/www/html
    networks:
      - simnote
    command: >
      bash -c "
          php artisan key:generate
          php artisan migrate:fresh --seed
          php-fpm
      "
  web:
    image: nginx:alpine
    container_name: simnote_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - simnote

  db:
    image: mysql:8
    container_name: simnote_db
    restart: always
    environment:
      MYSQL_DATABASE: sim_note
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    networks:
      - simnote

networks:
  simnote:

volumes:
  db_data: